name: Blog Auto Posting Bot

on:
  schedule:
    # 한국 시간(KST) 매일 오전 9시 정각 자동 실행
    - cron: '0 0 * * *' 
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Google Token File
      run: |
        echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

    - name: Run Auto Posting Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        
        # 💡 [치트키] 변경사항이 있으면 커밋하고, 없으면 에러 없이 조용히 넘어가는 마법의 한 줄입니다.
        git diff-index --quiet HEAD || git commit -m "🤖 아침 정기 포스팅 완료 및 히스토리 업데이트"
        
        # 깃허브에 최종 반영 (에러 방어용 장치 포함)
        git push origin main || echo "✨ 업데이트할 새로운 파일이 없습니다."
